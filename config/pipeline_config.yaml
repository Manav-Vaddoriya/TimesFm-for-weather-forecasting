# ============================================================
# Weather Pipeline Configuration
# ============================================================

pipeline:
  grib_file: "data.grib"
  years: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]

data:
  raw_chunks_per_year: 5
  series_id_batch_size: 1_000_000

temperature:
  dtype: "float16"

coordinates:
  dtype: "float32"
  round_decimals: 2

patches:
  patch_size: 32
  pad_value: 0.0

storage:
  # Local directory where all pipeline outputs are saved
  output_dir: "D:/projects 2/TimesFM and anomaly detection/output"

# ── Model Training ──────────────────────────────────────────
training:
  # Model architecture
  d_model: 128
  n_layers: 6
  n_heads: 4
  d_ff: 512
  dropout: 0.1
  context_len: 32

  # Training hyperparameters
  batch_size: 64
  lr: 0.001
  weight_decay: 0.00001
  epochs: 5
  num_workers: 2

  # Data split — number of .npy patch files per split
  train_files: 3    # first N files for training
  val_files: 1      # next N files for validation
  test_files: 1     # remaining files for testing

  # Output directory for model weights, metrics, plots
  model_output_dir: "D:/projects 2/TimesFM and anomaly detection/models/pretrained model"

# ── Anomaly Detection — Knowledge Distillation ──────────────────
distillation:
  # Data preparation — directory for distillation parquet outputs
  data_dir: "D:/projects 2/TimesFM and anomaly detection/output/distillation_dataset"

  # Data split — parquet part indices (1-indexed)
  train_parts: [1, 2, 3]
  val_parts:   [4]
  test_parts:  [5]

  # Student MLP architecture
  window_size:  32
  hidden_dims:  [512, 128, 64, 32]
  dropout:      0.2

  # Training hyperparameters
  epochs:       10
  batch_size:   256
  lr:           0.0005
  weight_decay: 0.001

  # Loss
  huber_delta:  1.0

  # Scheduler
  lr_min:       0.000001

  # Anomaly threshold (for segmentation)
  threshold:    0.9

  # Number of workers for data loading
  num_workers:  2

  # Output directory for distilled model weights, metrics
  model_output_dir: "D:/projects 2/TimesFM and anomaly detection/models/distilled model"